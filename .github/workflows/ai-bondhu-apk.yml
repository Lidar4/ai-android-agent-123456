name: Build AI Bondhu APK

on:
  push:
    branches: [ ai-bondhu-apk ]
    paths:
      - 'ai-bondhu-apk/**'
      - '.github/workflows/ai-bondhu-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ai-bondhu-apk
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-bondhu-debug-apk
          path: ai-bondhu-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
