name: Android build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android-agent/app/build/outputs/apk/debug/app-debug.apk }
# For release builds, add signing secrets through GitHub Actions secrets and use a protected keystore step.
